<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>PakBudget AI</title>
</head>
<body>
  <h1>💰 PakBudget AI</h1>
  <p>Apna Monthly Budget Track Karein</p>

  <input id="n" placeholder="Expense Name">
  <input id="a" placeholder="Amount Rs" type="number">
  <button onclick="add()">➕ Add Expense</button>

  <p>Total: Rs <span id="t">0</span></p>
  <ul id="l"></ul>
  <button onclick="tips()">📊 Get AI Tips</button>

<script>
let total = 0;
let expenses = [];

function add(){
  let n = document.getElementById('n').value;
  let a = parseFloat(document.getElementById('a').value);
  if(n=='' || isNaN(a)) return;
  expenses.push({name:n, amount:a});
  total += a;
  document.getElementById('t').innerText = total;
  renderExpenses();
  document.getElementById('n').value = '';
  document.getElementById('a').value = '';
}

function renderExpenses(){
  let l = document.getElementById('l');
  l.innerHTML = '';
  expenses.forEach((exp, i) => {
    l.innerHTML += `<li>${exp.name}: Rs ${exp.amount} <button onclick="deleteExpense(${i})">❌</button></li>`;
  })
}

function deleteExpense(index){
  total -= expenses[index].amount;
  expenses.splice(index,1);
  document.getElementById('t').innerText = total;
  renderExpenses();
}

function tips(){
  let tipBox = document.getElementById('l');
  if(total > 10000) tipBox.innerHTML = "<b>AI Tip:</b> Kharchay zyada hain, thora control karein 💡";
  else tipBox.innerHTML = "<b>AI Tip:</b> Budget theek hai, aise hi chalate rahen 👍";
}
</script>
</body>
</html>
